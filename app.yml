# yaml-language-server: $schema=https://schemas.pennsieve.io/app-manifest/v1.json
schemaVersion: "1.0"
application:
  name: ANTs registration to MNI152
  description: >-
    Registers each T1-weighted image to the MNI152NLin2009cAsym template (1 mm,
    brain-extracted, from TemplateFlow) with antsRegistrationSyNQuick.sh from ANTs
    2.6.5 (Tustison et al. 2021, Sci Rep 11:9068), and carries an optional label map
    (dseg) per subject into template space with nearest-label interpolation. Takes
    skull-stripped, bias-corrected T1w NIfTI images (typically <sub>_desc-n4_T1w.nii.gz);
    writes the warped images, the forward and inverse transforms, and a per-subject
    registration.json with a Dice overlap against the template brain mask as a
    sanity metric.
  type: processor
  tags: [neuroimaging, mri, nifti, ants, registration, mni]
runtime:
  cpu: 4096
  memory: 16384
  computeTypes: [standard]
  timeoutSeconds: 3600
parameters:
  - name: TRANSFORM_TYPE
    type: string
    description: >-
      Registration stages (antsRegistrationSyNQuick.sh -t). s: rigid + affine +
      deformable SyN (the default; writes a 1Warp and 1InverseWarp); b: rigid +
      affine + deformable B-spline SyN (also writes warps); a: rigid + affine only
      (affine .mat only); r: rigid only (a rigid .mat only).
    defaultValue: s
    validValues: [s, a, r, b]
  - name: THREADS
    type: integer
    description: Number of ITK threads (ITK_GLOBAL_DEFAULT_NUMBER_OF_THREADS, and -n for the script).
    defaultValue: 4
inputs:
  - name: image
    description: >-
      Skull-stripped T1-weighted NIfTI images to register, named
      <sub>[_<entities>]_T1w.nii.gz, e.g. sub-01_desc-n4_T1w.nii.gz from the N4 step.
      One per subject.
    mediaTypes: [application/x-nifti-gz, application/x-nifti]
    placement: subfolder
    required: true
  - name: labels
    description: >-
      Optional label maps in the image's space, named <sub>[_<entities>]_dseg.nii.gz
      (e.g. sub-01_dseg.nii.gz from SynthSeg), matched to the images by subject label
      and resampled into template space with GenericLabel interpolation.
    mediaTypes: [application/x-nifti-gz, application/x-nifti]
    placement: subfolder
    required: false
outputs:
  - name: warped
    description: >-
      Images in template space: <sub>_space-MNI152NLin2009cAsym_T1w.nii.gz and, when a
      label map was given, <sub>_space-MNI152NLin2009cAsym_dseg.nii.gz; plus provenance.json.
    mediaTypes: [application/x-nifti-gz, application/json]
  - name: transforms
    description: >-
      Per subject: <sub>_from-T1w_to-MNI152NLin2009cAsym_0GenericAffine.mat, and for
      deformable types _1Warp.nii.gz and _1InverseWarp.nii.gz; <sub>_registration.json
      with the transform type, the Dice overlap with the template brain mask and the command.
    mediaTypes: [application/octet-stream, application/x-nifti-gz, application/json]
